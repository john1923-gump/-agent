[project]
name = "jingxuetang"
version = "0.1.0"
description = "竞学堂学科知识整合智能体后端"
requires-python = ">=3.10"

[project.dependencies]
fastapi = "^0.111.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
python-multipart = "^0.0.6"
python-docx = "^0.9.0"
PyMuPDF = "^1.22.3"
sentence-transformers = "^2.2.2"
faiss-cpu = "^1.7.4"
pydantic = "^2.8.0"
openai = "^1.38.0"
aiofiles = "^23.1.0"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"