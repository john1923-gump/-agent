version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api-inference.modelscope.cn/v1/}
      - LLM_API_KEY=${LLM_API_KEY:-ms-placeholder}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend/data:/app/data
    networks:
      - knowledge-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - knowledge-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  knowledge-agent-network:
    driver: bridge

volumes:
  backend-data: